name: CI Pipeline

on:
  pull_request:
    branches: ["master", "lab6"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build project
        run: ./scripts/build.sh

      - name: Run unit tests
        run: ./scripts/unitTest.sh

      - name: Run full tests
        run: ./scripts/test.sh

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TEXT=
          "Ты меня не узнала, это я дэдпул.\n
          Я просто хотел немного познакомиться.\n
          Как тебя зовут детка?\n
          Чего ты одна?\n
          \n
          🚀 CI/CD: статус — *$STATUS*\nРепозиторий: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nЗапуск: ${{ github.run_number }}"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$TEXT" \
            -d parse_mode=Markdown
