name: CI Pipeline

on:
  pull_request:
    branches: ["master", "lab6"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build project
        run: ./scripts/build.sh

      - name: Run unit tests
        run: ./scripts/unitTest.sh

      - name: Run full tests
        run: ./scripts/test.sh
