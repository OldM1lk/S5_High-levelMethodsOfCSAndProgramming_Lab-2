name: CI Pipeline

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build project
        run: mvn -B clean package

      - name: Run unit tests
        run: mvn -B test

      - name: Run full tests
        run: mvn -B verify

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TEXT=$(cat <<EOF
          Ты меня не узнала, это я дэдпул.
          Я просто хотел немного познакомиться.
          Как тебя зовут детка?
          Чего ты одна?
          
          🔧 CI Pipeline
          Статус: $STATUS
          PR: ${{ github.event.pull_request.title }}
          Запуск: ${{ github.run_number }}
          EOF
          )
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$TEXT"
