name: CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build fat-jar
        run: ./scripts/fatBuild.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@62929198b55fa8f3670ebe3db225f3c2679e183b
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release v1.0.${{ github.run_number }}
          body: |
            Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          draft: false
          prerelease: false

      - name: Upload artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app-fat.jar
          asset_name: app-fat.jar
          asset_content_type: application/java-archive

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TEXT=$(cat <<EOF
          Ты меня не узнала, это я дэдпул.
          Я просто хотел немного познакомиться.
          Как тебя зовут детка?
          Чего ты одна?
          
          📦 CD Pipeline
          Статус: $STATUS
          Релиз: v1.0.${{ github.run_number }}
          Docker: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          EOF
          )
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$TEXT"
